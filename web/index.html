<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Bass Tab Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  textarea { width: 100%; height: 140px; font-family: monospace; }
  #controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  #error { color: #b00020; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Bass Tab Viewer</h1>
<div id="controls">
  <input type="file" id="file" accept=".alphatex,.txt">
  <button id="render">Render</button>
  <label><input type="checkbox" id="score" checked> Standard notation</label>
</div>
<textarea id="tex">\title "Sample"
\track "Bass" { instrument 33 }
\staff { score tabs }
\tuning (G2 D2 A1 E1)
\clef F4
\ts (4 4)
\tempo 120
0.4.4 0.3.4 0.2.4 0.1.4 |
2.2.8 3.2.8 4.2.8 5.2.8 1.1.2 |
5.3.2{d} -.3.4</textarea>
<div id="error"></div>
<div id="alphaTab"></div>
<script>
  const texEl = document.getElementById('tex');
  const errEl = document.getElementById('error');
  const scoreEl = document.getElementById('score');
  const api = new alphaTab.AlphaTabApi(document.getElementById('alphaTab'), {
    display: { staveProfile: 'ScoreTab' },
  });
  api.error.on(e => { errEl.textContent = String(e && (e.message || e)) + ' (details in browser console)'; });

  function render() {
    errEl.textContent = '';
    try { api.tex(texEl.value); } catch (e) { errEl.textContent = String(e.message || e); }
  }
  scoreEl.onchange = () => {
    api.settings.display.staveProfile = scoreEl.checked ? alphaTab.StaveProfile.ScoreTab : alphaTab.StaveProfile.Tab;
    api.updateSettings();
    render();
  };
  document.getElementById('render').onclick = render;
  document.getElementById('file').onchange = async (ev) => {
    const f = ev.target.files[0];
    if (f) { texEl.value = await f.text(); render(); }
  };
  render();
</script>
</body>
</html>
