<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bass Tab Maker</title>
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<style>
  :root { --bg: #fff; --fg: #1b1b1f; --muted: #5d5d66; --line: #d6d6dc; --accent: #2f5bd3; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #ececf1; --muted: #a5a5b0; --line: #3a3a42; --accent: #7fa2ff; --err: #ff8a80; }
  }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 1100px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  form { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input[type=url], select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > label { flex: 1 1 220px; }
  button { font: inherit; padding: 9px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin: 14px 0; min-height: 1.5em; }
  progress { width: 100%; height: 14px; }
  .err { color: var(--err); }
  .hint { color: var(--muted); font-size: .85rem; }
  #alphaTab { background: #fff; border-radius: 6px; margin-top: 8px; }
</style>
</head>
<body>
<h1>Bass Tab Maker</h1>
<form id="form">
  <label>유튜브/음악 링크
    <input type="url" name="url" id="url" placeholder="https://www.youtube.com/watch?v=...">
  </label>
  <div class="row">
    <label>또는 오디오 파일
      <input type="file" name="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac,.webm,.mp4">
    </label>
    <label>튜닝
      <select name="tuning" id="tuning">
        <option value="standard">표준 (E A D G)</option>
        <option value="drop-d">Drop D (D A D G)</option>
      </select>
    </label>
    <button id="go" type="submit">타브 만들기</button>
  </div>
  <div class="hint">CPU 처리 기준 3분 곡에 약 8분 걸립니다. 같은 링크를 다시 넣으면 끝난 단계는 건너뜁니다.</div>
</form>

<div id="status" role="status" aria-live="polite"></div>
<progress id="bar" max="100" value="0" hidden></progress>
<div id="alphaTab"></div>

<script>
  const STAGES = { queued: '대기 중', input: '오디오 받는 중', separation: '베이스 분리 중',
    pitch: '음높이 추적 중', beats: '박자 추적 중', notes: '노트 나누는 중', render: '타브 만드는 중', done: '완료' };
  const $ = id => document.getElementById(id);
  let api = null, timer = null;

  function show(msg, isErr) { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; }

  $('form').onsubmit = async (ev) => {
    ev.preventDefault();
    const body = new FormData();
    if ($('url').value.trim()) body.append('url', $('url').value.trim());
    if ($('file').files[0]) body.append('file', $('file').files[0]);
    body.append('tuning', $('tuning').value);
    $('go').disabled = true;
    try {
      const r = await fetch('/api/jobs', { method: 'POST', body });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      poll(j.job_id);
    } catch (e) { show('요청 실패: ' + e.message, true); $('go').disabled = false; }
  };

  function poll(id) {
    clearTimeout(timer);
    fetch('/api/jobs/' + id).then(r => r.json()).then(async s => {
      $('bar').hidden = false; $('bar').value = s.progress || 0;
      if (s.status === 'failed') { show('실패: ' + s.error, true); $('go').disabled = false; return; }
      show(`${STAGES[s.stage] || s.stage} (${s.progress || 0}%)`);
      if (s.status === 'done') { await render(id); $('go').disabled = false; return; }
      timer = setTimeout(() => poll(id), 2000);
    }).catch(e => { show('상태 확인 실패: ' + e.message, true); timer = setTimeout(() => poll(id), 5000); });
  }

  async function render(id) {
    const res = await (await fetch(`/api/jobs/${id}/result`)).json();
    show(`완료: ${res.tab.title} · ${Math.round(res.tab.bpm)} BPM · 노트 ${res.tab.notes.length}개`);
    if (!api) api = new alphaTab.AlphaTabApi($('alphaTab'), { display: { staveProfile: 'ScoreTab' } });
    api.tex(res.alphatex);
  }
</script>
</body>
</html>
